name: Tag release preflight (tagging blocked)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag-preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Block implicit tagging and release dispatch
        run: |
          echo "TAGGING BLOCKED: merging a release/hotfix branch is not authorization to tag or publish." >&2
          echo "Separate exact-candidate review and explicit human approval are required." >&2
          exit 1
