name: Release preflight (publication blocked)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing candidate tag; preflight will not publish"
        required: true
        type: string
      expected_sha:
        description: "Exact 40-character candidate source SHA"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Verify candidate identity and acceptance boundary
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Validate input syntax
        env:
          TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag source and version
        env:
          TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          [[ "$(git rev-parse --verify "refs/tags/$TAG^{commit}")" == "$EXPECTED_SHA" ]]
          [[ "$(tr -d '[:space:]' < VERSION)" == "${TAG#v}" ]]
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Block unqualified production operations
        run: |
          echo "RELEASE BLOCKED: exact-candidate acceptance verifier, device evidence, independent review and human GO required." >&2
          echo "No signing, credentials, uploads, tags or publication occur in this workflow." >&2
          exit 1
