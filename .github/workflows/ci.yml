name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test & Build (macOS)
    # macos-15 ships Swift 6.x required by WhisperKit → swift-jinja 2.x
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          set -euo pipefail
          sw_vers
          swift --version
          xcodebuild -version || true

      - name: Core tests
        run: swift run ZephyrFlowCoreTests

      - name: Release app bundle
        run: |
          set -euo pipefail
          chmod +x Scripts/build_app.sh
          ./Scripts/build_app.sh release

      - name: Verify bundle
        run: |
          set -euo pipefail
          test -d Dist/ZephyrFlow.app
          test -x Dist/ZephyrFlow.app/Contents/MacOS/ZephyrFlow
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Dist/ZephyrFlow.app/Contents/Info.plist
          codesign -dv Dist/ZephyrFlow.app 2>&1 | head -20

      - name: Upload app artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ZephyrFlow-macos-arm64-ci
          path: Dist/ZephyrFlow.app
          if-no-files-found: error
          retention-days: 7

  gates:
    name: Gates (XCTest, strict concurrency, lint, format, docs, version, drift, coverage)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          set -euo pipefail
          swift --version
          xcodebuild -version || true

      - name: Run all gates (fail closed)
        run: |
          set -euo pipefail
          chmod +x Scripts/ci_checks.sh
          ./Scripts/ci_checks.sh

      - name: Upload gate report (success)
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-gates-report
          path: docs/development/ci/coverage-baseline-report.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload gate report (failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-gates-failure-log
          path: |
            docs/development/ci/coverage-baseline-report.txt
          if-no-files-found: ignore
          retention-days: 30


  docs:
    name: Docs
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Build docs
        run: mkdocs build --strict

  version-sync:
    name: Version sync
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check VERSION alignment
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be semver x.y.z"
            exit 1
          fi
          grep -q "static let version = \"${version}\"" Sources/ZephyrFlow/Utilities/Constants.swift
          grep -q "<string>${version}</string>" Resources/Info.plist
          grep -q "^## \\[${version}\\]" CHANGELOG.md
          echo "Version ${version} is consistent."
