name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test & Build (macOS)
    # macos-15 ships Swift 6.x required by WhisperKit → swift-jinja 2.x
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          set -euo pipefail
          sw_vers
          swift --version
          xcodebuild -version || true

      - name: Core tests
        run: swift run ZephyrFlowCoreTests

      - name: Release app bundle
        run: |
          set -euo pipefail
          chmod +x Scripts/build_app.sh
          ./Scripts/build_app.sh release

      - name: Verify bundle
        run: |
          set -euo pipefail
          test -d Dist/ZephyrFlow.app
          test -x Dist/ZephyrFlow.app/Contents/MacOS/ZephyrFlow
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Dist/ZephyrFlow.app/Contents/Info.plist
          codesign -dv Dist/ZephyrFlow.app 2>&1 | head -20

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: ZephyrFlow-macos-arm64-ci
          path: Dist/ZephyrFlow.app
          if-no-files-found: error
          retention-days: 7

  docs:
    name: Docs
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Build docs
        run: mkdocs build --strict

  version-sync:
    name: Version sync
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check VERSION alignment
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be semver x.y.z"
            exit 1
          fi
          grep -q "static let version = \"${version}\"" Sources/ZephyrFlow/Utilities/Constants.swift
          grep -q "<string>${version}</string>" Resources/Info.plist
          grep -q "^## \\[${version}\\]" CHANGELOG.md
          echo "Version ${version} is consistent."
