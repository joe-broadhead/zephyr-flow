name: Prepare release preflight (mutations blocked)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Block inferred release preparation
        run: |
          echo "RELEASE PREPARATION BLOCKED: channel and exact-candidate acceptance policy remain incomplete." >&2
          echo "No branches, commits or pull requests are created; metadata consistency is not approval." >&2
          exit 1
